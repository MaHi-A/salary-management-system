services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: backend_production
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      DATABASE_HOST: db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-development_secret_key_base_change_me_before_real_use}
      FRONTEND_ORIGIN: http://localhost:8080
      HR_USER_EMAIL: ${HR_USER_EMAIL:-hr@acme.example}
      HR_USER_PASSWORD: ${HR_USER_PASSWORD:-password123}
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
