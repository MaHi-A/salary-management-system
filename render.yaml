# Render Blueprint for this project. Deploy via https://dashboard.render.com/blueprints
# -> "New Blueprint Instance" -> connect this GitHub repo -> Render reads this file.
#
# Creates three resources on Render's free tier:
#   - a Postgres database (free Postgres instances expire after 90 days -
#     fine for a take-home review, not for anything long-lived)
#   - the Rails API, built from backend/Dockerfile
#   - the React build, served as a static site
#
# NOTE on the two URLs below: Render's actual assigned names got a
# collision suffix on first deploy, so these are hardcoded to the real
# assigned URLs (salary-management-backend-i7y8, -frontend-8njl) rather
# than the guessed https://<name>.onrender.com pattern. If this blueprint
# is ever deployed fresh under different names, update both values to
# match whatever Render actually assigns, then redeploy the frontend
# (VITE_API_URL is baked in at build time, so it needs a rebuild to pick
# up a change) - editing them here, rather than only in the dashboard, is
# what matters since a future Blueprint sync overwrites dashboard-only
# edits with whatever is in this file.

databases:
  - name: salary-management-db
    databaseName: acme_salary
    plan: free

services:
  - type: web
    name: salary-management-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /up
    envVars:
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: salary-management-db
          property: connectionString
      - key: HR_USER_EMAIL
        value: hr@acme.example
      - key: HR_USER_PASSWORD
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://salary-management-frontend-8njl.onrender.com

  - type: web
    name: salary-management-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://salary-management-backend-i7y8.onrender.com/api
    routes:
      # This is a client-side-routed SPA (React Router). Without this, a
      # direct visit to a deep route like /login or /employees/42 404s,
      # since there's no actual file at that path - only index.html, which
      # then does the client-side routing once loaded. Mirrors what
      # frontend/nginx.conf's `try_files ... /index.html` does for the
      # Docker Compose deployment.
      - type: rewrite
        source: /*
        destination: /index.html
